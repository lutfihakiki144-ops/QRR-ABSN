<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Scanner QR Absensi</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  background: #111827;

  color: white;

  font-family: Arial, sans-serif;

}

.container {

  width: 100%;

  max-width: 600px;

  margin: auto;

  padding: 20px;

}

h1 {

  text-align: center;

  font-size: 22px;

}

.info {

  text-align: center;

  color: #cbd5e1;

  font-size: 14px;

  margin-bottom: 15px;

}

#reader {

  background: white;

  border-radius: 15px;

  padding: 8px;

  overflow: hidden;

}

select {

  width: 100%;

  padding: 12px;

  border-radius: 10px;

  border: none;

  margin-bottom: 15px;

}

#result {

  margin-top: 15px;

  padding: 12px;

  background: #1f2937;

  border-radius: 10px;

  word-break: break-word;

  text-align: center;

}

.error {

  color: #fca5a5;

}

</style>

</head>

<body>

<div class="container">

<h1>📷 SCANNER QR ABSENSI</h1>

<p class="info">
Arahkan kamera ke QR siswa
</p>

<select id="cameraSelect">

<option>
Memuat kamera...
</option>

</select>

<div id="reader"></div>

<div id="result">
Menunggu QR...
</div>

</div>


<script>

let scanner = null;

let cameras = [];

let sudahScan = false;


const cameraSelect =
  document.getElementById(
    'cameraSelect'
  );

const result =
  document.getElementById(
    'result'
  );


async function startCamera(
  cameraId
) {

  if (scanner) {

    try {

      await scanner.stop();

    } catch (e) {}

    try {

      await scanner.clear();

    } catch (e) {}

  }


  scanner =
    new Html5Qrcode(
      'reader'
    );


  sudahScan = false;


  try {

    await scanner.start(

      {
        deviceId: {
          exact: cameraId
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      function(decodedText) {

        if (sudahScan) {
          return;
        }

        sudahScan = true;

        result.textContent =
          'QR: ' + decodedText;


        /*
         * KIRIM HASIL KE
         * APLIKASI ABSENSI
         */

        if (
          window.opener &&
          !window.opener.closed
        ) {

          window.opener.postMessage(

            {
              type:
                'QR_SCAN_RESULT',

              code:
                decodedText

            },

            'https://script.google.com'

          );

        }


        setTimeout(
          function() {

            window.close();

          },
          700
        );

      },

      function() {

        // QR belum terbaca

      }

    );

  } catch (error) {

    result.innerHTML =
      '<span class="error">' +
      '❌ Tidak dapat mengakses kamera<br><br>' +
      'Izinkan kamera pada browser.' +
      '</span>';

    console.error(error);

  }

}


async function initCamera() {

  try {

    cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'Kamera tidak ditemukan'
      );

    }


    cameraSelect.innerHTML =
      '';


    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          camera.id;

        option.textContent =
          camera.label ||
          'Kamera ' +
          (index + 1);

        cameraSelect
          .appendChild(option);

      }
    );


    /*
     * Prioritaskan kamera belakang
     */

    const belakang =
      cameras.find(
        function(camera) {

          return /back|rear|environment/i
            .test(
              camera.label
            );

        }
      );


    const selected =
      belakang ||
      cameras[0];


    cameraSelect.value =
      selected.id;


    await startCamera(
      selected.id
    );

  } catch (error) {

    result.innerHTML =
      '<span class="error">' +
      '❌ Tidak dapat mengakses kamera<br><br>' +
      'Pastikan izin kamera browser sudah diberikan.' +
      '</span>';

    console.error(error);

  }

}


cameraSelect.addEventListener(
  'change',
  function() {

    startCamera(
      cameraSelect.value
    );

  }
);


initCamera();

</script>

</body>
</html>
